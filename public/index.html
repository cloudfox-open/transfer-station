<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="color-scheme" content="light dark">
  <title>文件中转站</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ==================== 图标 sprite（矢量，跟随文字颜色与主题） ==================== -->
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></symbol>
      <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.2h9A1.5 1.5 0 0 1 21 9.7v8.8A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5z"/><path d="M12 12.2v5M9.5 14.7h5"/></symbol>
      <symbol id="i-package" viewBox="0 0 24 24"><path d="M12 3l8.5 4.6v8.8L12 21l-8.5-4.6V7.6z"/><path d="M3.5 7.6L12 12.2l8.5-4.6M12 12.2V21"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.6 12a7.6 7.6 0 1 1-2.2-5.4"/><path d="M19.6 4.6v5h-5"/></symbol>
      <symbol id="i-view-details" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
      <symbol id="i-view-icons" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M3.5 16.5L7 20l3.5-3.5"/><path d="M17 20V4M13.5 7.5L17 4l3.5 3.5"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.8l2.5 5.1 5.6.8-4 3.9.9 5.6-5-2.7-5 2.7.9-5.6-4-3.9 5.6-.8z"/></symbol>
      <symbol id="i-memo" viewBox="0 0 24 24"><path d="M5.5 4h13a1 1 0 0 1 1 1v8.5L14 19H5.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M19.5 13.5H15a1 1 0 0 0-1 1V19"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.3A8.6 8.6 0 0 1 9.7 3.5a8.6 8.6 0 1 0 10.8 10.8z"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="1.6"/><path d="M9 20h6M12 16.5V20"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8.5 4v5h7V4M8.5 20v-6h7v6"/></symbol>
      <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 0 0 0 17c1.2 0 1.7-.9 1.4-1.8-.3-1 .4-1.8 1.5-1.8h1.6a4 4 0 0 0 2.5-7.1A8.5 8.5 0 0 0 12 3.5z"/><path d="M7.6 10.2h.01M10.6 7.6h.01M14.4 7.6h.01"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5.5L8.5 12 15 18.5"/></symbol>
      <symbol id="i-forward" viewBox="0 0 24 24"><path d="M9 5.5L15.5 12 9 18.5"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19.5v-15M6 10.5L12 4.5l6 6"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l4.6 4.6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5"/><path d="M4.5 19h15"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-compact" viewBox="0 0 24 24"><path d="M4 9h16M4 15h16"/><path d="M9.5 5l-3.5 4 3.5 4M14.5 11l3.5 4-3.5 4"/></symbol>
      <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M4 9V4.5h5M20 9V4.5h-5M4 15v4.5h5M20 15v4.5h-5"/></symbol>
      <symbol id="i-folder-line" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.2h9A1.5 1.5 0 0 1 21 9.7v8.8A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5z"/></symbol>
      <symbol id="i-drive" viewBox="0 0 24 24"><path d="M3 10.2h18v6a2.6 2.6 0 0 1-2.6 2.6H5.6A2.6 2.6 0 0 1 3 16.2z"/><path d="M3 10.2V7.4a2.6 2.6 0 0 1 2.6-2.6h12.8A2.6 2.6 0 0 1 21 7.4v2.8z"/><path d="M6.6 14.6h.01M15.6 14.6h2.8"/></symbol>
      <symbol id="i-rename" viewBox="0 0 24 24"><path d="M4 20h4.2L18.7 9.5a2.1 2.1 0 0 0-3-3L5.2 17z"/><path d="M14.6 5.4l4 4"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 6.6h15"/><path d="M9.2 6.6V5a1.2 1.2 0 0 1 1.2-1.2h3.2A1.2 1.2 0 0 1 14.8 5v1.6"/><path d="M6.6 6.6l.9 12.5a1.5 1.5 0 0 0 1.5 1.4h6a1.5 1.5 0 0 0 1.5-1.4l.9-12.5"/><path d="M10.4 10.7v6M13.6 10.7v6"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 11.2v5.6M12 7.9h.01"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="10.5" height="10.5" rx="1.7"/><path d="M15.4 6.2V5.6A1.6 1.6 0 0 0 13.8 4H5.6A1.6 1.6 0 0 0 4 5.6v8.2a1.6 1.6 0 0 0 1.6 1.6h.6"/></symbol>
      <symbol id="i-open-new" viewBox="0 0 24 24"><path d="M14 4.6h5.4V10"/><path d="M19.4 4.6l-7.6 7.6"/><path d="M18 14v4.4a1.6 1.6 0 0 1-1.6 1.6H5.6A1.6 1.6 0 0 1 4 18.4V7.6A1.6 1.6 0 0 1 5.6 6H10"/></symbol>
    </defs>
  </svg>

  <!-- ===================== 标题栏 ===================== -->
  <div class="titlebar">
    <div class="titlebar-left">
      <span class="app-mark"><svg class="gi"><use href="#i-monitor"/></svg></span>
      <span class="app-name">文件中转站</span>
      <span class="app-sub" id="titlebar-path">此电脑</span>
    </div>
    <div class="window-controls">
      <button class="wc-btn" onclick="toggleCompact()" title="紧凑模式"><svg class="gi"><use href="#i-compact"/></svg></button>
      <button class="wc-btn" onclick="toggleFullscreen()" title="全屏"><svg class="gi"><use href="#i-fullscreen"/></svg></button>
      <button class="wc-btn danger" onclick="closeTab(activeTabId)" title="关闭当前标签页"><svg class="gi"><use href="#i-close"/></svg></button>
    </div>
  </div>

  <!-- ===================== 标签栏 ===================== -->
  <div class="tabstrip">
    <div class="tabs" id="tabs"></div>
    <button class="tab-add" onclick="addTab()" title="新建标签页"><svg class="gi"><use href="#i-plus"/></svg></button>
  </div>

  <!-- ===================== 命令栏 ===================== -->
  <header class="explorer-header">
    <div class="command-bar">
      <button class="cmd-btn accent" onclick="triggerUpload()" title="上传文件到当前目录">
        <svg class="gi"><use href="#i-upload"/></svg><span class="cmd-txt">上传</span>
      </button>
      <button class="cmd-btn" onclick="newFolder()" title="新建文件夹">
        <svg class="gi"><use href="#i-folder-plus"/></svg><span class="cmd-txt">新建文件夹</span>
      </button>
      <span class="cmd-sep"></span>
      <button class="cmd-btn" onclick="downloadZip()" title="把当前目录打包成 zip 下载">
        <svg class="gi"><use href="#i-package"/></svg><span class="cmd-txt">打包下载</span>
      </button>
      <button class="cmd-btn" onclick="refreshView()" title="刷新">
        <svg class="gi"><use href="#i-refresh"/></svg><span class="cmd-txt">刷新</span>
      </button>
      <span class="cmd-sep"></span>
      <button class="cmd-btn" id="view-toggle-btn" onclick="toggleViewMode()" title="切换视图">
        <svg class="gi"><use href="#i-view-details"/></svg><span class="cmd-txt">详细信息</span>
      </button>
      <label class="cmd-select" title="排序方式">
        <svg class="gi"><use href="#i-sort"/></svg>
        <select id="sort-select" onchange="changeSort()">
          <option value="name-asc">名称 ↑</option>
          <option value="name-desc">名称 ↓</option>
          <option value="time-desc">最新修改</option>
          <option value="time-asc">最早修改</option>
          <option value="size-desc">大小 ↓</option>
          <option value="size-asc">大小 ↑</option>
        </select>
      </label>
      <span class="cmd-spacer"></span>
      <button class="cmd-btn icon-only" onclick="toggleFavorites()" title="收藏夹"><svg class="gi"><use href="#i-star"/></svg></button>
      <button class="cmd-btn icon-only" onclick="openMemoPanel()" title="备忘录"><svg class="gi"><use href="#i-memo"/></svg></button>
      <button class="cmd-btn icon-only" onclick="toggleTheme()" title="切换深色模式"><svg class="gi"><use href="#i-moon"/></svg></button>
      <button class="cmd-btn icon-only" id="fab-btn" onclick="toggleMenu()" title="更多"><svg class="gi"><use href="#i-more"/></svg></button>

      <div class="fab-menu" id="fab-menu">
        <div class="menu-item" onclick="openThisPC();closeMenu()">
          <svg class="gi menu-icon"><use href="#i-monitor"/></svg><span>此电脑（磁盘）</span>
        </div>
        <div class="menu-item" onclick="saveDefaultPath();closeMenu()">
          <svg class="gi menu-icon"><use href="#i-save"/></svg><span>保存默认路径</span>
        </div>
        <div class="menu-item" onclick="toggleTheme();closeMenu()">
          <svg class="gi menu-icon"><use href="#i-moon"/></svg><span>切换深色模式</span>
        </div>
        <div class="menu-item" onclick="toggleFavorites();closeMenu()">
          <svg class="gi menu-icon"><use href="#i-star"/></svg><span>收藏夹</span>
        </div>
        <div class="menu-item" onclick="triggerUpload();closeMenu()">
          <svg class="gi menu-icon"><use href="#i-upload"/></svg><span>上传文件</span>
        </div>
        <div class="menu-item" onclick="downloadZip();closeMenu()">
          <svg class="gi menu-icon"><use href="#i-package"/></svg><span>打包下载</span>
        </div>
        <div class="menu-item" onclick="openMemoPanel();closeMenu()">
          <svg class="gi menu-icon"><use href="#i-memo"/></svg><span>备忘录</span>
        </div>
        <div class="menu-item theme-picker-item">
          <svg class="gi menu-icon"><use href="#i-palette"/></svg><span>主题色</span>
          <div class="theme-colors" id="theme-colors">
            <span class="theme-dot active" style="background:#0078d4" data-color="#0078d4" onclick="setThemeColor('#0078d4', this)"></span>
            <span class="theme-dot" style="background:#00b7c3" data-color="#00b7c3" onclick="setThemeColor('#00b7c3', this)"></span>
            <span class="theme-dot" style="background:#8764b8" data-color="#8764b8" onclick="setThemeColor('#8764b8', this)"></span>
            <span class="theme-dot" style="background:#e3008c" data-color="#e3008c" onclick="setThemeColor('#e3008c', this)"></span>
            <span class="theme-dot" style="background:#ca5010" data-color="#ca5010" onclick="setThemeColor('#ca5010', this)"></span>
            <span class="theme-dot" style="background:#107c10" data-color="#107c10" onclick="setThemeColor('#107c10', this)"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- ===================== 地址栏 ===================== -->
    <div class="nav-bar">
      <button class="nav-btn mobile-only" onclick="toggleNavPane()" title="导航窗格"><svg class="gi"><use href="#i-menu"/></svg></button>
      <button class="nav-btn" id="nav-back" onclick="goBack()" title="后退" disabled><svg class="gi"><use href="#i-back"/></svg></button>
      <button class="nav-btn" id="nav-forward" onclick="goForward()" title="前进" disabled><svg class="gi"><use href="#i-forward"/></svg></button>
      <button class="nav-btn" onclick="goUp()" title="上一级"><svg class="gi"><use href="#i-up"/></svg></button>
      <button class="nav-btn" onclick="refreshView()" title="刷新"><svg class="gi"><use href="#i-refresh"/></svg></button>

      <div class="address-bar" id="address-bar">
        <span class="addr-ico" id="addr-ico"><svg class="gi"><use href="#i-folder-line"/></svg></span>
        <div class="breadcrumb" id="breadcrumb" onclick="startEditPath()"></div>
        <input type="text" id="path-input" placeholder="输入文件夹路径，例如 D:\Photos" spellcheck="false">
      </div>

      <div class="search-box">
        <span class="search-ico"><svg class="gi"><use href="#i-search"/></svg></span>
        <input type="text" id="search-input" placeholder="搜索">
      </div>
    </div>
  </header>

  <!-- ===================== 主体 ===================== -->
  <div class="explorer-body">
    <div class="nav-scrim" id="nav-scrim" onclick="toggleNavPane()"></div>

    <aside class="nav-pane" id="nav-pane">
      <div class="nav-group">
        <div class="nav-group-title">快速访问</div>
        <div class="nav-list" id="nav-favorites"></div>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">此电脑</div>
        <div class="nav-list" id="nav-drives"></div>
      </div>
    </aside>

    <main class="content" id="content">
      <div class="loading-bar" id="loading-bar" style="display:none">
        <div class="loading-track"><div class="loading-indeterminate"></div></div>
        <span class="loading-text" id="loading-text">正在读取文件夹…</span>
      </div>

      <section class="drives-view" id="drives-view" style="display:none">
        <div class="group-title">设备和驱动器</div>
        <div class="drive-grid" id="drive-grid"></div>
      </section>

      <section class="details-view" id="details-view" style="display:none">
        <div class="details-head" id="details-head">
          <div class="col col-name" data-col="name" onclick="sortByColumn('name')">名称</div>
          <div class="col col-time" data-col="time" onclick="sortByColumn('time')">修改日期</div>
          <div class="col col-type" data-col="type" onclick="sortByColumn('type')">类型</div>
          <div class="col col-size" data-col="size" onclick="sortByColumn('size')">大小</div>
        </div>
        <div class="details-body" id="details-body"></div>
        <div class="details-skeleton" id="details-skeleton" style="display:none"></div>
      </section>

      <section class="icons-view" id="icons-view" style="display:none">
        <div class="section" id="folders-section" style="display:none">
          <h2 class="section-title">文件夹</h2>
          <div class="folder-grid" id="folder-grid"></div>
        </div>

        <div class="section" id="images-section" style="display:none">
          <h2 class="section-title">图片</h2>
          <div class="media-grid" id="image-grid"></div>
        </div>

        <div class="section" id="videos-section" style="display:none">
          <h2 class="section-title">视频</h2>
          <div class="media-grid" id="video-grid"></div>
        </div>

        <div class="section" id="others-section" style="display:none">
          <h2 class="section-title">文件</h2>
          <div class="others-grid" id="others-grid"></div>
        </div>
      </section>

      <div class="empty-state" id="empty-state" style="display:none">
        <p>此文件夹为空</p>
      </div>
    </main>
  </div>

  <footer class="status-bar">
    <span id="status-left">就绪</span>
    <span id="status-right"></span>
  </footer>

  <input type="file" id="file-upload" multiple style="display:none" onchange="handleFileSelect(this.files)">

  <div class="drop-overlay" id="drop-overlay">
    <div class="drop-content">
      <div class="drop-icon"><svg class="gi"><use href="#i-upload"/></svg></div>
      <div class="drop-text">松开即可上传到当前文件夹</div>
    </div>
  </div>

  <div class="upload-panel" id="upload-panel">
    <div class="upload-header">
      <span>上传文件</span>
      <button class="close-btn" onclick="closeUploadPanel()"><svg class="gi"><use href="#i-close"/></svg></button>
    </div>
    <div class="upload-file-list" id="upload-file-list"></div>
    <div class="upload-progress-container" id="upload-progress-container" style="display:none">
      <div class="upload-progress-bar">
        <div class="upload-progress-fill" id="upload-progress-fill"></div>
      </div>
      <span class="upload-progress-text" id="upload-progress-text">0%</span>
    </div>
    <div class="upload-actions">
      <button class="upload-cancel-btn" onclick="closeUploadPanel()">取消</button>
      <button class="upload-confirm-btn" id="upload-confirm-btn" onclick="confirmUpload()">开始上传</button>
    </div>
  </div>

  <div class="favorites-panel" id="favorites-panel">
    <div class="favorites-header">
      <span><svg class="gi"><use href="#i-star"/></svg> 收藏夹</span>
      <button class="close-btn" onclick="toggleFavorites()"><svg class="gi"><use href="#i-close"/></svg></button>
    </div>
    <div class="favorites-list" id="favorites-list"></div>
    <button class="add-favorite-btn" onclick="addCurrentToFavorites()">+ 添加当前目录</button>
  </div>

  <div class="memo-panel" id="memo-panel">
    <div class="memo-panel-header">
      <span><svg class="gi"><use href="#i-memo"/></svg> 备忘录</span>
      <div class="memo-panel-actions">
        <button class="memo-panel-add" onclick="showMemoEditor()">+ 新建</button>
        <button class="close-btn" onclick="closeMemoPanel()"><svg class="gi"><use href="#i-close"/></svg></button>
      </div>
    </div>
    <div class="memo-list" id="memo-list"></div>
  </div>

  <div class="memo-editor-overlay" id="memo-editor-overlay">
    <div class="memo-editor">
      <div class="memo-editor-header">
        <span id="memo-editor-title">新建备忘录</span>
        <button class="close-btn" onclick="closeMemoEditor()"><svg class="gi"><use href="#i-close"/></svg></button>
      </div>
      <input type="text" id="memo-title-input" placeholder="标题（可选）" class="memo-input">
      <textarea id="memo-content-input" placeholder="写下你的想法..." class="memo-textarea"></textarea>
      <div class="memo-color-picker">
        <span class="memo-color-dot selected" style="background:#0078d4" onclick="selectMemoColor('#0078d4', this)"></span>
        <span class="memo-color-dot" style="background:#e3008c" onclick="selectMemoColor('#e3008c', this)"></span>
        <span class="memo-color-dot" style="background:#107c10" onclick="selectMemoColor('#107c10', this)"></span>
        <span class="memo-color-dot" style="background:#f59e0b" onclick="selectMemoColor('#f59e0b', this)"></span>
        <span class="memo-color-dot" style="background:#d13438" onclick="selectMemoColor('#d13438', this)"></span>
        <span class="memo-color-dot" style="background:#8764b8" onclick="selectMemoColor('#8764b8', this)"></span>
      </div>
      <button class="memo-save-btn" onclick="saveMemo()">保存</button>
    </div>
  </div>

  <div class="viewer" id="image-viewer">
    <button class="viewer-close" onclick="closeImageViewer()"><svg class="gi"><use href="#i-close"/></svg></button>
    <button class="viewer-nav prev" onclick="prevImage()"><svg class="gi"><use href="#i-back"/></svg></button>
    <button class="viewer-nav next" onclick="nextImage()"><svg class="gi"><use href="#i-forward"/></svg></button>
    <div class="viewer-counter" id="image-counter">1 / 1</div>
    <div class="slideshow-controls">
      <button id="slideshow-btn" onclick="toggleSlideshow()">▶ 自动播放</button>
      <select id="slideshow-speed" onchange="changeSlideshowSpeed()">
        <option value="3000">3秒</option>
        <option value="5000" selected>5秒</option>
        <option value="10000">10秒</option>
      </select>
    </div>
    <img id="viewer-img" alt="">
    <div class="viewer-info">
      <span id="viewer-name"></span>
      <a id="viewer-download" class="btn" download><svg class="gi"><use href="#i-download"/></svg> 下载</a>
    </div>
  </div>

  <div class="viewer pdf-viewer" id="pdf-viewer">
    <div class="pdf-toolbar">
      <button class="viewer-close" onclick="closePdfViewer()"><svg class="gi"><use href="#i-close"/></svg></button>
      <span class="pdf-title" id="pdf-name">文档</span>
      <div class="pdf-actions">
        <button class="pdf-btn" onclick="togglePdfFullscreen()">⛶ 全屏</button>
        <a id="pdf-download" class="pdf-btn" download>⬇ 下载</a>
      </div>
    </div>
    <iframe id="pdf-frame" class="pdf-frame" frameborder="0"></iframe>
  </div>

  <div class="viewer" id="video-viewer">
    <button class="viewer-close" onclick="closeVideoViewer()"><svg class="gi"><use href="#i-close"/></svg></button>
    <button class="viewer-nav prev" onclick="prevVideo()"><svg class="gi"><use href="#i-back"/></svg></button>
    <button class="viewer-nav next" onclick="nextVideo()"><svg class="gi"><use href="#i-forward"/></svg></button>
    <div class="viewer-counter" id="video-counter">1 / 1</div>
    <div class="video-controls-bar">
      <select id="video-speed" onchange="changeVideoSpeed()">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
    </div>
    <video id="viewer-video" controls playsinline webkit-playsinline></video>
    <div class="viewer-info">
      <span id="video-name"></span>
      <a id="video-download" class="btn" download><svg class="gi"><use href="#i-download"/></svg> 下载</a>
    </div>
  </div>

  <!-- 右键 / 长按菜单 -->
  <div class="ctx-menu" id="ctx-menu" role="menu" aria-hidden="true"></div>

  <!-- 通用对话框（删除确认 / 属性） -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-title" id="modal-title">标题</div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions">
        <button class="modal-btn" id="modal-cancel" type="button">取消</button>
        <button class="modal-btn primary" id="modal-ok" type="button">确定</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
